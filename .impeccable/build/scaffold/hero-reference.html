<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-a.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inria+Serif:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#28382d}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:2528px">
  <div class="r-wordmark region text" data-region="wordmark"><!-- THE OBERDORFER TEAM wordmark in widely spaced serif capitals, slate ink on plaster --><p style="font-size:var(--r-wordmark-font);line-height:1.05;margin:0">wordmark</p></div>
  <div class="r-affiliation region text" data-region="affiliation"><!-- at REWAP Brokerage LLC, small grotesk under the wordmark --><p style="font-size:var(--r-affiliation-font);line-height:1.05;margin:0">affiliation</p></div>
  <div class="r-issue-line region text" data-region="issue-line"><!-- Brand Book · No. 01 · Central Massachusetts · 2026, small grotesk, right-aligned --><p style="font-size:var(--r-issue-line-font);line-height:1.05;margin:0">issue-line</p></div>
  <div class="r-cover-stock region chrome" data-region="cover-stock"><!-- solid shutter-green cover stock panel holding the cover --></div>
  <div class="r-headline region text" data-region="headline"><!-- Home is personal. huge plaster-white serif on two lines --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-standfirst region text" data-region="standfirst"><!-- A brand book for a residential real-estate team in Worcester County, Massachusetts. small serif, two lines --><p style="font-size:var(--r-standfirst-font);line-height:1.05;margin:0">standfirst</p></div>
  <div class="r-open-button region control" data-region="open-button"><!-- brick-red rectangular button Open the book: rebuild the control's chrome from the crop (comp-spec.mjs --crop open-button); its ink box, border, fill, radius, and label size are the comp's --></div>
  <figure class="r-cover-photo region plate" data-region="cover-photo"><img src="../../../assets/plates/cover-photo.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-fig-caption region text" data-region="fig-caption"><!-- Fig. 01 caption, small grotesk plaster --><p style="font-size:var(--r-fig-caption-font);line-height:1.05;margin:0">fig-caption</p></div>
  <div class="r-index-rule region chrome" data-region="index-rule"><!-- thin plaster hairline above the contents index --></div>
  <div class="r-contents-index region text" data-region="contents-index"><!-- one-row contents index 01 Purpose to 12 Affiliation, brick numerals, plaster words --><p style="font-size:var(--r-contents-index-font);line-height:1.05;margin:0">contents-index</p></div>
</main>
</body>
</html>
