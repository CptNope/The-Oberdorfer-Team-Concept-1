<title>The Oberdorfer Team Brand Book</title>
<meta name="description" content="Brand book No. 01 for The Oberdorfer Team, a residential real-estate team at REWAP Brokerage LLC, Central Massachusetts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Inria+Serif:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap">
<style>
/* Layout: an architecture quarterly on New England stock. Cover and chapter openers are full-bleed colored stock; reading pages are plaster with a 12-column grid and a running folio. */
:root {
  color-scheme: light;
  /* stocks */
  --green: #28382D;      /* shutter green: cover + chapter openers */
  --plaster: #E8E7E3;    /* reading pages */
  --oak: #B98D5A;        /* second stock */
  --brick: #9B3A29;      /* spot ink on plaster; primary action */
  /* inks */
  --slate: #2A3136;      /* body ink on plaster */
  --ink-deep: #1C2124;   /* ink on oak */
  --stone: #5E6660;      /* secondary ink on plaster */
  --clay: #E0937A;       /* brick's tint, numerals on green */
  --lichen: #A9B5AC;     /* secondary ink on green */
  --rule: rgba(42, 49, 54, .22);
  --rule-on-green: rgba(232, 231, 227, .38);

  --serif: 'Inria Serif', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
  --sans: 'Archivo', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif;

  /* the comp frame: 2528 x 1696 */
  --u: calc(100vw / 2528);
}
html { background: var(--plaster); }
body { margin: 0; background: var(--plaster); color: var(--slate); font-family: var(--serif); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
::selection { background: var(--brick); color: var(--plaster); }
a { color: inherit; text-underline-offset: .18em; text-decoration-thickness: 1px; }
:focus-visible { outline: 2px solid var(--brick); outline-offset: 3px; }
.cover :focus-visible { outline-color: var(--clay); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Cover (comp A) ---------- */
.cover-frame { position: relative; }
.masthead { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
.wordmark { margin: 0; font-family: var(--serif); font-weight: 400; text-transform: uppercase; letter-spacing: .4464em; line-height: 1; color: var(--green); white-space: nowrap; }
.wordmark-aff { display: block; font-family: var(--sans); font-stretch: 82%; font-weight: 400; letter-spacing: .01em; text-transform: none; color: var(--green); line-height: 1; }
.issue-line { margin: 0; font-family: var(--sans); font-stretch: 82%; font-weight: 400; color: var(--green); line-height: 1; white-space: nowrap; }
.cover { background: var(--green); color: var(--plaster); }
.cover h1 { margin: 0; font-family: var(--serif); font-weight: 700; letter-spacing: -.012em; line-height: .86; color: var(--plaster); }
.standfirst { margin: 0; font-family: var(--serif); font-weight: 400; line-height: 1.24; letter-spacing: -.006em; color: var(--plaster); }
.open-book { display: inline-flex; align-items: center; justify-content: center; background: var(--brick); color: #F7F5F1; text-decoration: none; font-family: var(--sans); font-stretch: 88%; font-weight: 400; line-height: 1; transition: background-color .25s cubic-bezier(.2,.7,.2,1); }
.open-book:hover { background: #87301F; }
.cover-fig { margin: 0; }
.cover-fig img { display: block; width: 100%; height: 100%; object-fit: cover; }
.cover-fig figcaption, .fig-cap { font-family: var(--sans); font-stretch: 82%; font-weight: 400; line-height: 1.2; color: var(--plaster); }
.contents-index { font-family: var(--sans); font-stretch: 82%; font-weight: 400; }
.contents-index ol { list-style: none; margin: 0; padding: 0; display: flex; justify-content: space-between; gap: 0; }
.contents-index a { text-decoration: none; color: var(--plaster); white-space: nowrap; }
.contents-index a:hover { text-decoration: underline; }
.contents-index .n { color: var(--clay); font-variant-numeric: tabular-nums; margin-right: .3em; }
.index-rule { border: 0; margin: 0; height: 1px; background: var(--rule-on-green); }

/* Desktop: the cover is the measured comp frame, scaled to the viewport width. */
@media (min-width: 1100px) {
  .cover-frame { width: 100%; height: calc(1696 * var(--u)); overflow: hidden; }
  .cover-frame > *, .cover > * { position: absolute; }
  .masthead { display: contents; }
  .wordmark, .issue-line { position: absolute; }
  .cover-fig picture { display: block; width: 100%; height: 100%; }
  .wordmark { left: 3.44%; top: 2.59%; font-size: calc(56 * var(--u)); letter-spacing: .38em; }
  .wordmark-aff { position: absolute; left: 0; top: calc(64 * var(--u)); font-size: calc(35 * var(--u)); }
  .issue-line { right: 3.25%; top: 4.13%; font-size: calc(34 * var(--u)); }
  .cover { left: 3.56%; top: 10.73%; width: 92.88%; height: 85.67%; }
  .cover h1 { left: calc((6.33% - 3.56%) / .9288); top: calc((28.3% - 10.73%) / .8567); font-size: calc(232 * var(--u)); }
  .standfirst { left: calc((6.33% - 3.56%) / .9288); top: calc((58.67% - 10.73%) / .8567); width: calc(34 / 92.88 * 100%); font-size: calc(35 * var(--u)); }
  .open-book { left: calc((6.33% - 3.56%) / .9288); top: calc((67.10% - 10.73%) / .8567); width: calc(10.76 / 92.88 * 100%); height: calc(5.31 / 85.67 * 100%); font-size: calc(30 * var(--u)); }
  .cover-fig { left: calc((57.36% - 3.56%) / .9288); top: calc((14.21% - 10.73%) / .8567); width: calc(36.79 / 92.88 * 100%); height: calc(68.99 / 85.67 * 100%); }
  .cover-fig figcaption { position: absolute; left: 0; top: calc(100% + 13 * var(--u)); font-size: calc(26 * var(--u)); white-space: nowrap; }
  .index-rule { left: 0; width: 100%; top: calc((89.74% - 10.73%) / .8567 + 4 * var(--u)); height: max(1px, calc(3 * var(--u))); background: rgba(232, 231, 227, .62); }
  .contents-index { left: calc((6.33% - 3.56%) / .9288); top: calc((91.98% - 10.73%) / .8567); width: calc(87.62 / 92.88 * 100%); font-size: calc(34 * var(--u)); }
}

/* Tablet and phone: the cover becomes a stacked issue cover. */
@media (max-width: 1099.98px) {
  .cover-frame { padding: 20px 16px 0; }
  .masthead { padding-bottom: 18px; }
  .wordmark { font-size: clamp(15px, 3.1vw, 30px); letter-spacing: .32em; }
  .wordmark-aff { font-size: clamp(13px, 1.9vw, 17px); margin-top: .55em; }
  .issue-line { font-size: 13px; text-align: right; white-space: normal; max-width: 15em; line-height: 1.3; }
  .cover { display: grid; grid-template-columns: 1fr; gap: 28px; padding: 36px 24px 26px; }
  .cover h1 { font-size: clamp(64px, 17vw, 150px); }
  .standfirst { font-size: clamp(18px, 2.6vw, 24px); max-width: 30ch; }
  .open-book { justify-self: start; padding: 15px 22px; font-size: 17px; min-height: 48px; box-sizing: border-box; }
  .cover-fig { aspect-ratio: 4 / 5; max-height: 72vh; }
  .cover-fig figcaption { margin-top: 10px; font-size: 13px; color: var(--lichen); }
  .cover-fig { display: grid; grid-template-rows: 1fr auto; aspect-ratio: auto; }
  .cover-fig img { aspect-ratio: 4 / 5; max-height: 72vh; }
  .contents-index ol { flex-wrap: wrap; justify-content: flex-start; gap: 10px 18px; font-size: 15px; }
  .contents-index a { display: inline-block; padding: 6px 0; }
}
@media (max-width: 560px) {
  .masthead { flex-direction: column; gap: 10px; }
  .issue-line { text-align: left; max-width: none; }
  .wordmark { letter-spacing: .26em; font-size: 15px; }
}
